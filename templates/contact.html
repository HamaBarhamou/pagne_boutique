{% extends 'base.html' %}
{% block title %}Contact — {{ BUSINESS_NAME }}{% endblock %}
{% block content %}
<div class="hero">
  <h2 style="margin:0 0 10px">Contact</h2>
  <p><strong>Téléphone :</strong> {{ BUSINESS_PHONE }}</p>
  <p><strong>Adresse :</strong> {{ BUSINESS_ADDRESS }}</p>
  <p><strong>Horaires :</strong> {{ BUSINESS_HOURS }}</p>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px">
    <a class="btn" target="_blank" href="https://wa.me/{{ BUSINESS_WHATSAPP }}">WhatsApp</a>
    {% if maps_url %}<a class="btn btn-outline" target="_blank" href="{{ maps_url }}">Nous trouver</a>{% endif %}
  </div>
</div>
{% endblock %}
